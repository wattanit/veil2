# Phase 0 to-do P0.4 and P0.5 — Technical Specification §8.1, HC-6, HC-8.
#
# macOS, Windows, and Linux are peers, not a primary and two ports. A failure
# on any one fails the build, and fail-fast is off so one platform's failure
# never hides the other two: fixing platforms one at a time is how a project
# acquires a primary platform without deciding to.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # T0.1 — the workspace builds and tests on all three platforms (HC-8).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  # T0.9 — lint and format gates block the build.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # T0.9 — the supply-chain gate blocks the build (HC-6, Spec §7).
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The lockfile is part of the build (Spec §8.3). `--locked` above fails when
  # it is stale; this makes the reason legible rather than leaving it as an
  # obscure resolver error.
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --format-version 1 --locked > /dev/null

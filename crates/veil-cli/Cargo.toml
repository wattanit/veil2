[package]
name = "veil-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "veil"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }

# Supply-chain gate (Technical Specification §7, HC-6).
#
# Every dependency is pinned; this file and `cargo audit` fail the build.
# Additions to the dependency set require a Specification bump (Phase 0
# to-do P0.5.b), so a new entry here without one is a defect.

[graph]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory is ignored. An ignore entry here is a decision that needs a
# reason recorded next to it and an owner who made it.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The workspace crates are unpublished and carry no licence field yet; that is
# the owner's decision to make, not a build gate's.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Nothing may reintroduce the failure mode the taxonomy exists to prevent.
deny = [
    # Spec §6: `anyhow` is not used in the library. The original Veil's
    # `From<anyhow::Error>` conversion is how a wrong password and a corrupted
    # vault became one value to every caller.
    # Spec §6 permits it at a binary's top level, and as of Phase 3 the command
    # line is that binary. The wrapper list is the enforcement: anything else
    # reaching for it — `veil-core` above all — still fails this gate.
    { name = "anyhow", wrappers = ["veil-cli"] },
    # Spec §7: `sled` is not carried forward — unmaintained since 2021.
    { name = "sled" },
    # A-1: the core never prompts. These are the dependencies that would make
    # it able to. The command line prompts and is allowed one; the ban stays so
    # that "which crate can ask the user for something" is answered here rather
    # than by whoever adds the next dependency.
    { name = "rpassword", wrappers = ["veil-cli"] },
    { name = "dialoguer" },
    { name = "inquire" },
]

# The only duplicate left is `syn`, a proc-macro dependency: compiled by the
# build, never linked into a binary, reaching no runtime code path. Unifying it
# would mean pinning `clap_derive` and `serde_derive` against
# `tracing-attributes` for no gain HC-6 recognises. Every cryptographic crate
# resolves to a single version.
skip-tree = [{ name = "syn", version = "=2.0.119", depth = 1 }]

# `rpassword` reaches the Windows API bindings one version behind `clap`. The
# crate is a Windows-only FFI shim, it is not cryptographic, and neither copy
# is reachable on the platform this project is verified on. It costs bytes in a
# Windows binary and nothing else. Pinned to the exact version so that a future
# drift fails this gate again rather than being covered by a standing waiver.
skip = [{ name = "windows-sys", version = "=0.59.0" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
